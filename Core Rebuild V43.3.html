<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天堂M Core Rebuild V43.3｜戰鬥動畫完整版</title>
<style>
:root{--bg:#05070a;--panel:#101827;--panel2:#172235;--line:#334155;--text:#e5eef9;--muted:#94a3b8;--gold:#facc15;--green:#22c55e;--red:#ef4444;--blue:#60a5fa;--purple:#c084fc;--orange:#fb923c;--cyan:#06b6d4}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
.app{display:none}.app.hide{display:none}.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:999}.modal.hide{display:none}.modal-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;max-width:600px;width:90%;max-height:90vh;overflow-y:auto}.title{font-size:20px;font-weight:600;margin:10px 0;color:var(--text)}.muted{color:var(--muted);font-size:12px}.card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:12px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}button{background:var(--blue);color:#fff;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;font:14px inherit;transition:all .2s}.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}.cyan{color:var(--cyan)}.purple{color:var(--purple)}

/* === 戰鬥畫面樣式 === */
#battleScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0f1419 0%,#1a2332 100%);display:none;z-index:1000;flex-direction:column;align-items:center;justify-content:center;color:var(--text);font-family:inherit}
#battleScreen.show{display:flex}
#battleMap{width:100%;height:100%;position:relative;display:flex;flex-direction:column}
.battle-title{text-align:center;padding:15px;font-size:18px;font-weight:bold;border-bottom:1px solid var(--line)}.battle-area{flex:1;display:flex;align-items:center;justify-content:space-around;padding:40px 20px;position:relative}
.battle-char,.battle-enemy{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:120px}
.char-sprite,.enemy-sprite{width:80px;height:80px;background-size:contain;background-repeat:no-repeat;background-position:center;display:flex;align-items:center;justify-content:center;font-size:40px;transition:all .1s}
.char-sprite.shake{animation:shake .3s 3}
.enemy-sprite.flash{animation:flash .2s 2}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.4}}
.char-name,.enemy-name{font-weight:bold;font-size:14px}.battle-hp{width:150px;height:20px;background:var(--panel);border:1px solid var(--line);border-radius:3px;overflow:hidden}.hp-bar{height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);transition:width .3s;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}.hp-text{font-size:11px;color:var(--muted)}.battle-log{background:var(--panel);border:1px solid var(--line);border-radius:4px;height:120px;overflow-y:auto;padding:10px;margin:15px 0;font-size:12px;color:var(--muted)}.log-entry{padding:4px 0;border-bottom:1px solid var(--line2,#1e293b)}.log-entry:last-child{border:none}.log-damage{color:var(--red)}.log-heal{color:var(--green)}.log-crit{color:var(--purple);font-weight:bold}
.damage-number{position:absolute;font-weight:bold;pointer-events:none;animation:float-up 1.5s ease-out forwards;font-size:18px}
.damage-normal{color:var(--red)}
.damage-crit{color:var(--purple);font-size:24px;text-shadow:0 0 10px rgba(192,132,252,.8)}
@keyframes float-up{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-50px)}}
.battle-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:15px}
.battle-actions button{padding:10px 20px;min-width:80px}
.battle-actions button:hover:not(:disabled){background:var(--blue);opacity:.8}
.battle-actions button:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.v-sep{width:2px;height:60px;background:var(--line)}
.battle-status{display:flex;gap:30px;align-items:flex-start;padding:20px;background:rgba(0,0,0,.3);border-radius:4px;justify-content:center;flex-wrap:wrap}
.status-item{text-align:center}.status-label{font-size:11px;color:var(--muted)}.status-value{font-size:18px;font-weight:bold;margin-top:4px}
.victory{text-align:center;color:var(--green);font-size:18px;font-weight:bold;margin:20px 0}
.defeat{text-align:center;color:var(--red);font-size:18px;font-weight:bold;margin:20px 0}
</style>
</head>
<body>
<div id="start" class="modal"><div class="panel modal-card"><h1 class="title" style="font-size:40px;text-align:center">天堂M Core Rebuild</h1><p class="muted" style="text-align:center">單機HTML｜離線遊戲｜完整戰鬥動畫系統<br/><br/></p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button id="newBtn" class="gold" style="grid-column:1/-1">新遊戲</button><button id="loadBtn" class="blue" style="grid-column:1/-1">讀取存檔</button></div></div></div>
<div id="classModal" class="modal hide"><div class="panel modal-card"><h2 class="title">選擇職業</h2><div id="classList" class="grid classes" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))"></div></div></div>
<div id="battleScreen" class="battle-screen">
  <div id="battleMap" class="battle-map">

    <div class="battle-area">

        <div class="hp-text" id="enemyHpText">HP: 100/100</div>

    <div class="battle-log" id="battleLog"><div class="log-entry muted">戰鬥開始！</div></div>
    <div class="battle-status" id="battleStatus"></div>
    <div class="battle-actions" id="battleActions"></div>
  </div>
</div>
<div id="app" class="app"><div class="panel top"><div><span class="title" style="font-size:22px">天堂M Core Rebuild｜V43.3 戰鬥版</span> <span id="subtitle" class="muted"></span></div><div><span id="className" class="gold" style="margin-right:20px"></span> <span id="lv" class="gold"></span> <span id="adena" class="blue"></span> <span id="diamond" class="cyan"></span></div></div><div class="panel tabs" id="tabs"></div><div class="panel body" id="body" style="overflow-y:auto;height:calc(100vh - 140px)"></div><div style="text-align:center;padding:10px;font-size:11px;color:var(--muted)">v43.3 © 2025 | 單機模擬遊戲</div></div>

<script>
'use strict';
const R={N:['一般',1],R:['高級',2],SR:['稀有',3],SSR:['英雄',4],L:['傳說',5],M:['神話',6]};
const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const DB={classes:{},item:{},cards:{},maps:[],dungeons:[],bosses:[],codex:[],skills:{}};
function addClass(id,name,stats,weapons,desc){DB.classes[id]={id,name,stats,weapons,desc};}
[['prince','王族',{str:13,dex:10,con:12,int:10,wis:11},['sword','dagger'],'血盟與輔助'],['knight','騎士',{str:16,dex:12,con:15,int:8,wis:9},['sword','twohand','spear'],'高防禦近戰'],['elf','妖精',{str:10,dex:15,con:10,int:13,wis:12},['bow','sword'],'敏捷型遠程'],['darkelf','暗黑妖精',{str:12,dex:15,con:11,int:14,wis:10},['claw','bow'],'法術型敏捷'],['dragonknight','龍騎士',{str:18,dex:10,con:16,int:12,wis:11},['sword','twohand'],'終極坦克'],['magus','魔法師',{str:8,dex:10,con:10,int:18,wis:14},['staff','wand'],'魔力之源']].forEach(x=>addClass(...x));
function addItem(id,o){DB.item[id]=Object.assign({id,type:'material',rank:'N',price:100},o);}
const weapons=[['short_sword','短劍','dagger',5,'N'],['katana','武士刀','sword',17,'R'],['mailbreaker','破壞之劍','sword',24,'SR'],['death_blade','死亡騎士烈炎劍','sword',36,'SSR'],['dragon_slayer','屠龍者','twohand',45,'L'],['mythic_excalibur','傳說聖劍','sword',60,'M']];
weapons.forEach((x,i)=>addItem(x[0],{name:x[1],type:'weapon',weapon:x[2],dmg:x[3],rank:x[4],safe:6,price:1200*(i+1)*R[x[4]][1]}));
[['tshirt','T恤','tshirt',0,'N',{}],['iron_helm','鋼盔','helmet',-2,'R',{}],['iron_armor','鋼鐵盔甲','armor',-7,'R',{}],['magic_cloak','抗魔斗篷','cloak',-3,'SR',{mr:10}],['power_gloves','力量手套','gloves',-2,'R',{str:2}]].forEach(([id,name,type,ac,rank,stat])=>addItem(id,{name,type,ac,rank,stat,safe:4,price:500*R[rank][1]}));
[['brave_necklace','勇氣項鍊','amulet',{dmg:3},'SR'],['wisdom_ring','智慧戒指','ring',{int:2,wis:1},'SR'],['def_ring','守護戒指','ring',{ac:-2,dr:2},'SR'],['dark_earring','黑暗耳環','earring',{str:1,dmg:2},'R']].forEach(([id,name,type,stat,rank])=>addItem(id,{name,type,rank,stat,safe:0,price:2000*R[rank][1]}));
[['potion_red','紅水',45,90],['potion_orange','橙水',210,260],['potion_clear','白水',650,680],['leaf_box','葉子補充箱',5000,0]].forEach(x=>addItem(x[0],{name:x[1],type:x[0]=='leaf_box'?'box':'potion',rank:'N',price:x[2],effect:x[3]}));
[['scroll_weapon','武卷','weapon',75000],['scroll_armor','防卷','armor',30000],['scroll_bless_weapon','祝武','weapon',260000],['scroll_bless_armor','祝防','armor',120000]].forEach(([id,name,target,price])=>addItem(id,{name,type:'scroll',rank:'R',target,price}));
['材料1','材料2','材料3','材料4','材料5','材料6','材料7','材料8','材料9','材料10'].forEach((n,i)=>addItem('mat'+i,{name:n,type:'material',rank:'N',price:50}));
function card(id,name,rank,stat,kind){DB.cards[id]={id,name,rank,stat,kind};}
[['t_orc','妖魔','N',{spd:3},'transform'],['t_skel','骷髏','R',{dex:1,spd:5},'transform'],['t_succ','魅魔','SR',{int:2,mp:80,spd:8},'transform'],['t_dk','死亡騎士','SSR',{str:3,dmg:8,hit:5,spd:10},'transform'],['t_dragon','龍形態','L',{dmg:15,dr:5,spd:12},'transform']].forEach(x=>card(...x));
[['d_fairy','小妖精','N',{hp:30,spd:2},'doll'],['d_popo','肥肥','R',{hp:80,dmg:3},'doll'],['d_sylph','精靈','SR',{hp:150,mp:50,int:2},'doll'],['d_unicorn','獨角獸','SSR',{hp:200,dmg:8,dr:3},'doll']].forEach(x=>card(...x));
DB.maps=[['talking','說話之島',1,18,['哥布林','妖魔','狼人'],['short_sword','tshirt','potion_red','mat0']],['gludin','古魯丁地監',18,38,['骷髏','殭屍','食屍鬼'],['katana','iron_helm','potion_orange','mat1']],['giran','奇岩城',38,50,['騎士','法師','守衛'],['mailbreaker','iron_armor','scroll_weapon','mat2']],['dragon','龍之谷',50,70,['飛龍','龍人','龍族法師'],['death_blade','magic_cloak','scroll_bless_weapon','mat5']],['antharas','安塔瑞斯巢穴',70,99,['安塔瑞斯','大龍','龍騎士'],['dragon_slayer','dark_earring','leaf_box','mat7']]];
DB.dungeons=[{id:'dg0',name:'試煉副本',lv:20,cost:50,reward:5000,type:'daily'},{id:'dg1',name:'龍之鑽石',lv:50,cost:100,reward:15000,type:'daily'},{id:'dg2',name:'傲慢之塔',lv:60,cost:150,reward:25000,type:'daily'}];
DB.bosses=[{id:'b0',name:'巨大飛龍',lv:30,hp:1500,zone:'world'},{id:'b1',name:'巴風特',lv:40,hp:2500,zone:'world'},{id:'b2',name:'死亡騎士',lv:50,hp:3500,zone:'world'},{id:'b3',name:'安塔瑞斯',lv:70,hp:8000,zone:'dragon'},{id:'b4',name:'獅心王',lv:85,hp:15000,zone:'hell'}];
DB.codex=[['武器收藏I',['katana','mailbreaker'],{dmg:2}],['龍裝收藏',['dragon_slayer','magic_cloak','dark_earring'],{dmg:10,dr:6}]];
const skillNames={prince:['精準目標','王族威嚴','激勵士氣','君主之怒','血盟守護','王者命令','突襲指揮','戰場號令','君主反擊','榮耀之劍','王者降臨','君主凝視'],knight:['盾牌格擋','聖光斬','聖光防禦','聖光治癒','聖騎之力','聖光淨化','聖光護罩','終極防禦','聖光復活','聖光制裁','聖光彙聚','聖光終極']};
const types=['active','buff','passive','active','buff','passive','active','buff','passive','active','buff','passive'], typeName={active:'主動攻擊',buff:'輔助/增益',passive:'被動'};
Object.keys(DB.classes).forEach(cls=>{(skillNames[cls]||[]).forEach((name,i)=>{let rank=['N','N','R','R','SR','SR','SSR','SSR','L','L','M','M'][i], lv=[1,4,8,12,20,28,38,48,60,70,82,90][i], type=types[i%types.length]; DB.skills['sk_'+cls+'_'+i]={id:'sk_'+cls+'_'+i,name,rank,lv,type,typeName:typeName[type],stat:{dmg:Math.floor(lv/10)+1}}; });});
const Store={key:'lm_core_rebuild_v43',save:s=>localStorage.setItem('lm_core_rebuild_v43',JSON.stringify(s)),load:()=>{try{return JSON.parse(localStorage.getItem('lm_core_rebuild_v43'))}catch{return null}}};
const Game={s:null,timer:null,tab:'dash',pick:null,inBattle:false,battleState:{},$ :id=>document.getElementById(id),init(){this.bind();this.classList();this.$('loadBtn').disabled=!Store.load();},
base(cls){const c=DB.classes[cls]||DB.classes.knight;return{version:'core_rebuild_v43',cls:c.id,lv:1,exp:0,adena:5000,diamond:0,leaf:200,hp:1,mp:1,map:'talking',mon:null,stats:{...c.stats},inv:{'potion_red|0':{id:'potion_red',qty:50,enchant:0},'short_sword|0|start':{id:'short_sword',qty:1,enchant:0},'tshirt|0|start':{id:'tshirt',qty:1,enchant:0}},equip:{weapon:null,helmet:null,tshirt:null,armor:null,cloak:null,gloves:null,boots:null,amulet:null,belt:null,earring1:null,earring2:null,ring1:null,ring2:null,rune:null,seal:null,relic:null},cards:{},active:{transform:null,doll:null},learnedSkills:{},skillLevels:{},skillAwake:{},settings:{hpLimit:35,autoPotion:true,autoBuy:false,autoBoss:false,autoSell:false,autoSkills:[]},guild:{name:'',lv:1,donate:0,skill:0},daily:{dungeon:3,boss:1,kills:0},ach:{kills:0,boss:0,draw:0,craft:0,diamond:0},diamondLog:[],codex:{},growth:{mastery:0,magic:0,pvp:0},last:Date.now()};},
split(s){const p=String(s).split('|');return p.length>1?p.slice(0,-1).join('|'):s;},
def(id){return DB.item[id]||DB.cards[id];},
inv(k){const p=this.split(k);return this.s.inv[k];},
card(id){return DB.cards[id];},
map(){return DB.maps.find(m=>m.id===this.s.map)||DB.maps[0];},
cls(){return DB.classes[this.s.cls]||DB.classes.knight;},
classSkills(){return Object.values(DB.skills).filter(sk=>sk.id.includes(this.s.cls));},
slots(){return{weapon:'武器',helmet:'頭盔',tshirt:'內衣',armor:'盔甲',cloak:'斗篷',gloves:'手套',boots:'鞋子',amulet:'項鍊',belt:'腰帶',earring1:'耳環1',earring2:'耳環2',ring1:'戒指1',ring2:'戒指2',rune:'符石',seal:'印章',relic:'聖物'};},
total(){let st={...this.s.stats};Object.values(this.s.equip||{}).forEach(k=>{const d=this.def(this.inv(k)?.id);if(!d)return;if(d.dmg)st.dmg=(st.dmg||0)+d.dmg;if(d.ac)st.ac=(st.ac||0)+d.ac;Object.entries(d.stat||{}).forEach(([k,v])=>st[k]=(st[k]||0)+v);});return st;},
fmt(n){return Math.floor(n||0).toLocaleString();},
rand(a,b){return a+Math.floor(Math.random()*(b-a+1));},
log(msg,color='white'){const log=this.$('battleLog');if(log){const entry=document.createElement('div');entry.className='log-entry'+(color==='red'?' log-damage':color==='green'?' log-heal':color==='purple'?' log-crit':'');entry.textContent=msg;log.appendChild(entry);log.scrollTop=log.scrollHeight;}},
showDamage(selector,dmg,isCrit){const el=this.$(selector),battleArea=this.$('battleArea');if(!el||!battleArea)return;const rect=el.getBoundingClientRect();const dmgEl=document.createElement('div');dmgEl.className='damage-number '+(isCrit?'damage-crit':'damage-normal');dmgEl.textContent=isCrit?'爆擊 '+dmg:dmg;dmgEl.style.left=rect.left+rect.width/2-20+'px';dmgEl.style.top=rect.top-20+'px';battleArea.appendChild(dmgEl);setTimeout(()=>dmgEl.remove(),1500);},
shake(selector){const el=this.$(selector);if(el){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),300);}},
flash(selector){const el=this.$(selector);if(el){el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),200);}},
startBattle(monName,monHp){this.inBattle=true;this.battleState={playerHp:this.maxHp(),playerMaxHp:this.maxHp(),monsterHp:monHp,monsterMaxHp:monHp,monsterName:monName,round:0};this.$('battleScreen').classList.add('show');this.renderBattle();},
renderBattle(){this.$('battleTitle').textContent=this.map().name+' - '+this.battleState.monsterName;this.$('charName').textContent=this.cls().name+' Lv.'+this.s.lv;this.$('charSprite').textContent='⚔️';this.$('charHpBar').style.width=(this.battleState.playerHp/this.battleState.playerMaxHp*100)+'%';this.$('charHpText').textContent='HP: '+this.fmt(this.battleState.playerHp)+'/'+this.fmt(this.battleState.playerMaxHp);this.$('enemyName').textContent=this.battleState.monsterName;this.$('enemySprite').textContent='👹';this.$('enemyHpBar').style.width=(this.battleState.monsterHp/this.battleState.monsterMaxHp*100)+'%';this.$('enemyHpText').textContent='HP: '+this.fmt(this.battleState.monsterHp)+'/'+this.fmt(this.battleState.monsterMaxHp);const actions=['<button onclick="G.battleAttack()">⚔️ 攻擊</button>','<button onclick="G.battleUsePotion()">💚 回復</button>','<button onclick="G.battleFlee()">🏃 逃跑</button>','<button onclick="G.battleEnd()">❌ 結束</button>'];this.$('battleActions').innerHTML=actions.join('');},
battleAttack(){const st=this.total(),dmg=this.rand(Math.floor((st.dmg||5)+this.s.lv/2),Math.floor((st.dmg||5)*1.5+this.s.lv));const isCrit=Math.random()<0.15;const finalDmg=isCrit?Math.floor(dmg*1.5):dmg;this.shake('charSprite');setTimeout(()=>{this.battleState.monsterHp-=finalDmg;this.flash('enemySprite');this.showDamage('enemySprite',finalDmg,isCrit);this.log('⚔️ 你攻擊了 '+this.battleState.monsterName+(isCrit?' (爆擊!!!)':'')+' 造成 '+finalDmg+' 傷害',isCrit?'purple':'white');if(this.battleState.monsterHp<=0){this.battleWin();return;}this.battleMonsterAttack();this.renderBattle();},300);},
battleUsePotion(){const potionKey=Object.keys(this.s.inv).find(k=>this.def(this.inv(k)?.id)?.type==='potion');if(!potionKey){this.log('❌ 沒有回復藥水','red');return;}const heal=this.rand(30,50);this.battleState.playerHp=Math.min(this.battleState.playerMaxHp,this.battleState.playerHp+heal);this.log('💚 你使用了藥水，恢復 '+heal+' HP','green');this.rem(potionKey,1);this.battleMonsterAttack();this.renderBattle();},
battleFlee(){if(Math.random()<0.4){this.log('🏃 成功逃脫！','green');this.endBattle();return;}this.log('❌ 逃脫失敗！','red');this.battleMonsterAttack();this.renderBattle();},
battleMonsterAttack(){const dmg=this.rand(5,15);this.battleState.playerHp-=dmg;this.flash('charSprite');this.showDamage('charSprite',dmg,false);this.log('👹 怪物攻擊你 造成 '+dmg+' 傷害','red');if(this.battleState.playerHp<=0){this.battleLose();return;}},
battleWin(){this.s.ach.kills++;this.s.daily.kills++;this.s.adena+=this.rand(100,300);this.s.exp=Math.min(this.need(),this.s.exp+this.rand(50,150));this.log('🎉 勝利！獲得金幣和經驗！','green');setTimeout(()=>this.endBattle(),2000);},
battleLose(){this.log('💀 戰敗...','red');this.battleState.playerHp=0;setTimeout(()=>this.endBattle(),2000);},
battleEnd(){this.endBattle();},
endBattle(){this.inBattle=false;this.$('battleScreen').classList.remove('show');this.level();this.render();},
maxHp(){const st=this.total();return Math.max(1,Math.floor(120+this.s.lv*22+(st.con||10)*12));},
maxMp(){const st=this.total();return Math.max(1,Math.floor(55+this.s.lv*9+(st.wis||10)*8+(st.int||10)*5));},
need(){return Math.floor(Math.pow(this.s.lv,1.5)*100);},
level(){while(this.s.exp>=this.need()){this.s.exp-=this.need();this.s.lv++;this.s.hp=this.maxHp();this.s.mp=this.maxMp();}},
hunt(){const m=this.map();if(!m)return;const mon={name:m.mons[this.rand(0,m.mons.length-1)],hp:this.rand(m.min*10,m.min*20)};this.startBattle(mon.name,mon.hp);},
kill(m){this.s.ach.kills++;this.s.adena+=this.rand(m.hp/20,m.hp/10);this.s.exp+=this.rand(50,200);const drop=m.drops[this.rand(0,m.drops.length-1)];if(drop)this.addItem(drop,this.rand(1,3));this.level();},
addItem(id,qty=1){if(!DB.item[id])return;const k=id+'|0';this.s.inv[k]=this.s.inv[k]||{id,qty:0,enchant:0};this.s.inv[k].qty+=qty;},
rem(k,q){const it=this.inv(k);if(it){it.qty-=q;if(it.qty<=0)delete this.s.inv[k];}},
sell(k){const it=this.inv(k),d=this.def(it?.id);if(!it||!d)return;this.s.adena+=(d.price||100)*it.qty;delete this.s.inv[k];this.log('賣出 '+d.name+' 取得 '+(d.price||100)*it.qty+' 金幣','green');this.render();},
equip(k){k=this.split(k);const it=this.inv(k),d=this.def(it?.id);if(!it||!d||!['weapon','helmet','tshirt','armor','cloak','gloves','boots','amulet','belt','earring','ring','rune','seal','relic'].includes(d.type))return;const slot=d.type==='ring'?this.s.equip.ring1?'ring2':'ring1':d.type==='earring'?this.s.equip.earring1?'earring2':'earring1':d.type;if(this.s.equip[slot])this.s.inv[this.split(this.s.equip[slot])+'|0'].qty++;this.s.equip[slot]=k;delete this.s.inv[k];this.log('裝備 '+d.name,'green');this.render();},
use(k){const it=this.inv(k),d=this.def(it?.id);if(!d)return;if(d.type==='potion'&&d.effect){this.s.hp=Math.min(this.maxHp(),this.s.hp+d.effect);this.log('使用 '+d.name+' 恢復 '+d.effect+' HP','green');}this.rem(k,1);this.render();},
save(auto=false){Store.save(this.s);this.log('存檔成功','green');},
load(){const save=Store.load();if(!save)return;this.s=save;this.render();this.$('start').classList.add('hide');this.$('app').classList.remove('hide');},
action(a,arg){if(a==='hunt')this.hunt();else if(a==='sell')this.sell(arg);else if(a==='equip')this.equip(arg);else if(a==='use')this.use(arg);},
renderTab(){this.$('body').innerHTML='';if(this.tab==='hunt')this.$('body').innerHTML=this.viewHunt();else if(this.tab==='bag')this.$('body').innerHTML=this.viewBag();else if(this.tab==='skills')this.$('body').innerHTML=this.viewSkills();else if(this.tab==='dash')this.$('body').innerHTML=this.viewDash();},
render(){this.ensure();const st=this.total();this.$('className').textContent=this.cls().name;this.$('lv').textContent='Lv.'+this.s.lv;this.$('adena').textContent='💰 '+this.fmt(this.s.adena);this.$('diamond').textContent='💎 '+this.fmt(this.s.diamond);const tabs=['dash','hunt','bag','skills'];const tabHtml=tabs.map(t=>'<button class="'+(this.tab===t?'on':'')+'">'+(['總覽','狩獵','背包','技能'][tabs.indexOf(t)])+'</button>').join('');this.$('tabs').innerHTML=tabHtml;this.renderTab();},
renderStatus(){this.ensure();this.s.hp=Math.min(this.s.hp,this.maxHp());this.s.mp=Math.min(this.s.mp,this.maxMp());},
ensure(){if(!this.s)return;const c=DB.classes[this.s.cls]||DB.classes.knight;this.s.cls=c.id;this.s.stats=Object.assign({},c.stats||{},this.s.stats||{});['str','dex','con','int','wis'].forEach(k=>this.s.stats[k]=Number.isFinite(this.s.stats[k])?this.s.stats[k]:(c.stats||{})[k]||10);this.s.lv=Math.max(1,Math.min(99,Math.floor(this.s.lv||1)));this.s.exp=Math.max(0,this.s.exp||0);this.s.adena=Math.max(0,this.s.adena||0);this.s.diamond=Math.max(0,this.s.diamond||0);this.s.leaf=Math.max(0,Math.min(200,this.s.leaf||200));this.s.hp=Math.max(1,this.s.hp||1);this.s.mp=Math.max(0,this.s.mp||0);},
viewDash(){return `<h3 class="title">總覽</h3><div class="card"><b>戰力</b><div style="font-size:24px" class="gold">${this.fmt(this.total().dmg*12+this.s.lv*30)}</div></div><div class="grid"><div class="card"><b>金幣</b><div class="gold">${this.fmt(this.s.adena)}</div></div><div class="card"><b>鑽石</b><div class="cyan">${this.fmt(this.s.diamond)}</div></div><div class="card"><b>等級</b><div class="gold">${this.s.lv}</div></div><div class="card"><b>經驗</b><div class="blue">${this.fmt(this.s.exp)}/${this.fmt(this.need())}</div></div></div><div class="card"><b>今日</b><br/>狩獵次數: <span class="gold">${this.s.daily.kills||0}</span> | 擊殺數: <span class="gold">${this.s.ach.kills||0}</span></div>`;},
viewHunt(){const maps=DB.maps.map(m=>`<div class="card" style="cursor:pointer" onclick="G.s.map='${m.id}';G.hunt()"><b>${E(m.name)}</b><br/><span class="muted">Lv.${m.min}-${m.max}</span><br/><span class="muted">怪物: ${E(m.mons.join('、'))}</span></div>`).join('');return `<h3 class="title">狩獵地圖</h3><p class="muted">點擊地圖進入戰鬥</p><div class="grid">${maps}</div>`;},
viewBag(){const items=Object.keys(this.s.inv).map(k=>{const it=this.inv(k),d=this.def(it?.id);if(!d)return'';const actions=[`<button onclick="G.sell('${k}')">賣出</button>`];if(['weapon','helmet','tshirt','armor','cloak','gloves','boots','amulet','belt','earring','ring','rune','seal','relic'].includes(d.type))actions.push(`<button onclick="G.equip('${k}')">裝備</button>`);if(d.type==='potion')actions.push(`<button onclick="G.use('${k}')">使用</button>`);return `<div class="card"><b class="r-${d.rank}">${E(d.name)} ×${it.qty}</b><br/><span class="muted">${d.type}</span><br/>${actions.join(' ')}</div>`;}).join('');return `<h3 class="title">背包</h3><div class="grid">${items}</div>`;},
viewSkills(){return `<h3 class="title">技能</h3><p class="muted">技能系統準備中</p>`;},
classList(){const html=Object.values(DB.classes).map(c=>`<button class="card" onclick="G.s=G.base('${c.id}');G.render();window.G.$('classModal').classList.add('hide');window.G.$('app').classList.remove('hide');">${c.name}<br/><span class="muted">${c.desc}</span></button>`).join('');this.$('classList').innerHTML=html;},
bind(){this.$('newBtn').onclick=()=>{this.$('start').classList.add('hide');this.$('classModal').classList.remove('hide');};this.$('loadBtn').onclick=()=>{this.load();};const tabs=['dash','hunt','bag','skills'];this.$('tabs').addEventListener('click',e=>{if(e.target.tagName==='BUTTON'){const idx=Array.from(this.$('tabs').children).indexOf(e.target);this.tab=tabs[idx];this.renderTab();}});}};
window.G=Game;
Game.init();
</script>
</body>
</html>
