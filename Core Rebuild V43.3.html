<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天堂M Core Rebuild V43｜分解材料優化版</title>
<style>
:root{--bg:#05070a;--panel:#101827;--panel2:#172235;--line:#334155;--text:#e5eef9;--muted:#94a3b8;--gold:#facc15;--green:#22c55e;--red:#ef4444;--blue:#60a5fa;--purple:#c084fc;--orange:#fb923c;--cyan:#06b6d4}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
.app{display:none}.app.hide{display:none}.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:999}.modal.hide{display:none}.modal-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;max-width:600px;width:90%;max-height:90vh;overflow-y:auto}.title{font-size:20px;font-weight:600;margin:10px 0;color:var(--text)}.muted{color:var(--muted);font-size:12px}.card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:12px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}button{background:var(--blue);color:#fff;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;font:14px inherit;transition:all .2s}.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}.cyan{color:var(--cyan)}.purple{color:var(--purple)}.row{display:flex;gap:10px;align-items:center}
/* === 戰鬥畫面樣式 === */
#battleScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0f1419 0%,#1a2332 100%);display:none;z-index:1000;flex-direction:column;align-items:center;justify-content:center;color:var(--text)}#battleScreen.show{display:flex}#battleMap{width:100%;height:100%;position:relative;display:flex;flex-direction:column}.battle-title{text-align:center;padding:15px;font-size:18px;font-weight:bold;border-bottom:1px solid var(--line);color:var(--cyan)}.battle-area{flex:1;display:flex;align-items:center;justify-content:space-around;padding:40px 20px;position:relative}.battle-char,.battle-enemy{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:100px}.char-sprite,.enemy-sprite{width:70px;height:70px;display:flex;align-items:center;justify-content:center;font-size:40px;transition:all .1s}.char-sprite.shake{animation:shake .3s}
.enemy-sprite.flash{animation:flash .2s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes flash{0%,100%{opacity:1}50%{opacity:.4}}.char-name,.enemy-name{font-weight:bold;font-size:13px;margin-bottom:5px}.battle-hp{width:130px;height:16px;background:var(--panel);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin:4px 0}.hp-bar{height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);transition:width .3s;font-size:10px;color:#fff;display:flex;align-items:center;justify-content:center}.hp-text{font-size:10px;color:var(--muted)}.battle-log{background:var(--panel);border:1px solid var(--line);border-radius:4px;height:100px;overflow-y:auto;padding:10px;margin:10px 0;font-size:11px;color:var(--muted);flex-shrink:0}.log-entry{padding:3px 0;border-bottom:1px solid #1e293b}.log-entry:last-child{border:none}.log-damage{color:var(--red)}.log-heal{color:var(--green)}.log-crit{color:var(--purple);font-weight:bold}.damage-number{position:absolute;font-weight:bold;pointer-events:none;animation:float-up 1.5s ease-out forwards;font-size:16px}.damage-normal{color:var(--red)}.damage-crit{color:var(--purple);font-size:22px;text-shadow:0 0 10px rgba(192,132,252,.8)}@keyframes float-up{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-50px)}}.battle-actions{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:10px;flex-shrink:0}.battle-actions button{padding:8px 16px;min-width:70px;font-size:12px}.battle-actions button:hover:not(:disabled){opacity:.8}.v-sep{width:1px;height:50px;background:var(--line)}.battle-status{display:flex;gap:20px;align-items:flex-start;padding:10px;background:rgba(0,0,0,.3);border-radius:4px;justify-content:center;flex-wrap:wrap;font-size:11px}
</style>
</head>
<body>
<div id="start" class="modal"><div class="panel modal-card"><h1 class="title" style="font-size:40px;text-align:center">天堂M Core Rebuild</h1><p class="muted" style="text-align:center">單機HTML｜離線存檔｜V43.3 戰鬥完整版<br/><br/></p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button id="newBtn" class="gold" style="grid-column:1/-1">新遊戲</button><button id="loadBtn" style="grid-column:1/-1">讀取存檔</button></div></div></div>
<div id="classModal" class="modal hide"><div class="panel modal-card"><h2 class="title">選擇職業</h2><div id="classList" class="grid classes"></div></div></div>
<div id="battleScreen"><div id="battleMap"><div class="battle-title" id="battleTitle"></div><div class="battle-area"><div class="battle-char"><div class="char-name" id="charName"></div><div class="char-sprite" id="charSprite">⚔️</div><div class="battle-hp"><div class="hp-bar" id="charHpBar" style="width:100%"></div></div><div class="hp-text" id="charHpText">100/100</div></div><div class="v-sep"></div><div class="battle-enemy"><div class="enemy-name" id="enemyName"></div><div class="enemy-sprite" id="enemySprite">👹</div><div class="battle-hp"><div class="hp-bar" id="enemyHpBar" style="width:100%;background:linear-gradient(90deg,#ef4444,#dc2626)"></div></div><div class="hp-text" id="enemyHpText">100/100</div></div></div><div class="battle-log" id="battleLog"><div class="log-entry">戰鬥開始！</div></div><div class="battle-actions" id="battleActions"></div></div></div>
<div id="app" class="app hide"><div class="panel top"><div><span class="title" style="font-size:22px">天堂M Core Rebuild｜核心整合版</span> <span id="subtitle" class="muted"></span></div><div><span id="className" class="gold"></span> <span id="lv" class="gold" style="margin-left:15px"></span> <span id="adena" class="blue" style="margin-left:15px"></span> <span id="diamond" class="cyan" style="margin-left:15px"></span></div></div><div class="panel tabs" id="tabs"></div><div class="panel body" id="body"></div></div>

<script>
'use strict';
const R={N:['一般',1],R:['高級',2],SR:['稀有',3],SSR:['英雄',4],L:['傳說',5],M:['神話',6]};
const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const DB={classes:{},item:{},cards:{},maps:[],dungeons:[],bosses:[],codex:[],skills:{}};
function addClass(id,name,stats,weapons,desc){DB.classes[id]={id,name,stats,weapons,desc};}
[['prince','王族',{str:13,dex:10,con:12,int:10,wis:11},['sword','dagger'],'血盟與輔助'],['knight','騎士',{str:16,dex:12,con:15,int:8,wis:9},['sword','twohand','spear'],'高防禦近戰'],['elf','妖精',{str:10,dex:15,con:10,int:13,wis:12},['bow','sword'],'敏捷型遠程']].forEach(x=>addClass(...x));
function addItem(id,o){DB.item[id]=Object.assign({id,type:'material',rank:'N',price:100},o);}
const weapons=[['short_sword','短劍','dagger',5,'N'],['katana','武士刀','sword',17,'R'],['mailbreaker','破壞之劍','sword',24,'SR'],['death_blade','死亡騎士烈炎劍','sword',36,'SSR']];
weapons.forEach((x,i)=>addItem(x[0],{name:x[1],type:'weapon',weapon:x[2],dmg:x[3],rank:x[4],safe:6,price:1200*(i+1)*R[x[4]][1]}));
[['tshirt','T恤','tshirt',0,'N',{}],['iron_helm','鋼盔','helmet',-2,'R',{}]].forEach(([id,name,type,ac,rank,stat])=>addItem(id,{name,type,ac,rank,stat,safe:4,price:500*R[rank][1]}));
[['potion_red','紅水',45,90],['potion_orange','橙水',210,260]].forEach(x=>addItem(x[0],{name:x[1],type:'potion',rank:'N',price:x[2],heal:x[3]}));
function card(id,name,rank,stat,kind){DB.cards[id]={id,name,rank,stat,kind};}
DB.maps=[['talking','說話之島',1,18,['哥布林','妖魔','狼人'],['short_sword','tshirt','potion_red']],['gludin','古魯丁地監',18,38,['骷髏','殭屍','食屍鬼'],['katana','iron_helm','potion_orange']],['giran','奇岩城',38,50,['騎士','��師','守衛'],['mailbreaker','tshirt','potion_orange']]];
DB.dungeon=['試煉副本','夢幻之島','龍之鑽石'].map((n,i)=>({id:'dg'+i,name:n,lv:20+i*15,cost:50+i*30,reward:5000+i*5000}));
DB.bosses=['巨大飛龍','巴風特','死亡騎士'].map((n,i)=>({id:'b'+i,name:n,lv:30+i*10,hp:1500+i*1500}));
DB.codex=[['武器收藏I',['katana','mailbreaker'],{dmg:2}]];
const skillNames={prince:['精準目標','王族威嚴','激勵士氣','君主之怒','血盟守護','王者命令'],knight:['盾牌格擋','聖光斬','聖光防禦','聖光治癒','聖騎之力','聖光淨化']};
Object.keys(DB.classes).forEach(cls=>{(skillNames[cls]||[]).forEach((name,i)=>{DB.skills['sk_'+cls+'_'+i]={id:'sk_'+cls+'_'+i,name,rank:['N','R','SR','SSR','L','M'][i]||'N',lv:[1,5,15,30,50,70][i]||1,type:['active','buff','passive'][i%3]};});});
const Store={key:'lm_core_rebuild_v43',save:s=>localStorage.setItem('lm_core_rebuild_v43',JSON.stringify(s)),load:()=>{try{return JSON.parse(localStorage.getItem('lm_core_rebuild_v43'))}catch{return null}}};
const Game={s:null,timer:null,tab:'dash',inBattle:false,battleState:{},$:id=>document.getElementById(id),init(){this.bind();this.classList();this.$('loadBtn').disabled=!Store.load();},
base(cls){const c=DB.classes[cls]||DB.classes.knight;return{version:'core_rebuild_v43',cls:c.id,lv:1,exp:0,adena:5000,diamond:0,leaf:200,hp:1,mp:1,map:'talking',stats:{...c.stats},inv:{'potion_red|0':{id:'potion_red',qty:50,enchant:0},'short_sword|0|start':{id:'short_sword',qty:1,enchant:0}},equip:{weapon:null,helmet:null,tshirt:null,armor:null},cards:{},learnedSkills:{},daily:{dungeon:3,boss:1,kills:0},ach:{kills:0,boss:0},last:Date.now()};},
split(s){const p=String(s).split('|');return p.length>1?p.slice(0,-1).join('|'):s;},def(id){return DB.item[id]||DB.cards[id];},inv(k){return this.s.inv[k];},map(){return DB.maps.find(m=>m.id===this.s.map)||DB.maps[0];},cls(){return DB.classes[this.s.cls]||DB.classes.knight;},
total(){let st={...this.s.stats};Object.values(this.s.equip||{}).forEach(k=>{const d=this.def(this.inv(k)?.id);if(!d)return;if(d.dmg)st.dmg=(st.dmg||0)+d.dmg;if(d.ac)st.ac=(st.ac||0)+d.ac;});return st;},
fmt(n){return Math.floor(n||0).toLocaleString();},rand(a,b){return a+Math.floor(Math.random()*(b-a+1));},
log(msg,color='white'){const log=this.$('battleLog');if(log){const e=document.createElement('div');e.className='log-entry'+(color==='red'?' log-damage':color==='green'?' log-heal':color==='purple'?' log-crit':'');e.textContent=msg;log.appendChild(e);log.scrollTop=log.scrollHeight;}},
showDamage(sel,dmg,crit){const el=this.$(sel);if(!el)return;const rect=el.getBoundingClientRect();const d=document.createElement('div');d.className='damage-number '+(crit?'damage-crit':'damage-normal');d.textContent=crit?'⚡'+dmg:dmg;d.style.left=rect.left+'px';d.style.top=rect.top+'px';this.$('battleMap').appendChild(d);setTimeout(()=>d.remove(),1500);},
shake(sel){const el=this.$(sel);if(el){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),300);}},flash(sel){const el=this.$(sel);if(el){el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),200);}},
startBattle(name,hp){this.inBattle=true;this.battleState={pHp:this.maxHp(),pMax:this.maxHp(),mHp:hp,mMax:hp,mName:name,round:0};this.$('battleScreen').style.display='flex';this.renderBattle();},
renderBattle(){this.$('battleTitle').textContent=this.map().name+' - '+this.battleState.mName;this.$('charName').textContent=this.cls().name+' Lv.'+this.s.lv;this.$('enemyName').textContent=this.battleState.mName;this.$('charHpBar').style.width=(this.battleState.pHp/this.battleState.pMax*100)+'%';this.$('charHpText').textContent=this.fmt(this.battleState.pHp)+'/'+this.fmt(this.battleState.pMax);this.$('enemyHpBar').style.width=(this.battleState.mHp/this.battleState.mMax*100)+'%';this.$('enemyHpText').textContent=this.fmt(this.battleState.mHp)+'/'+this.fmt(this.battleState.mMax);const acts=['<button onclick="G.battleAttack()">⚔️ 攻擊</button>','<button onclick="G.battleUsePotion()">💚 回復</button>','<button onclick="G.battleFlee()">🏃 逃跑</button>','<button onclick="G.battleEnd()">❌ 結束</button>'];this.$('battleActions').innerHTML=acts.join('');},
battleAttack(){const st=this.total(),dmg=this.rand(Math.floor((st.dmg||5)+this.s.lv/2),Math.floor((st.dmg||5)*1.5+this.s.lv));const crit=Math.random()<0.15;const fin=crit?Math.floor(dmg*1.5):dmg;this.shake('charSprite');setTimeout(()=>{this.battleState.mHp-=fin;this.flash('enemySprite');this.showDamage('enemySprite',fin,crit);this.log('⚔️ 攻擊 '+(crit?'爆擊!!!':'')+' -'+fin,crit?'purple':'white');if(this.battleState.mHp<=0){this.battleWin();return;}this.battleMonsterAttack();this.renderBattle();},300);},
battleUsePotion(){const pk=Object.keys(this.s.inv).find(k=>this.def(this.inv(k)?.id)?.type==='potion');if(!pk){this.log('❌ 沒有藥水','red');return;}const heal=this.rand(30,50);this.battleState.pHp=Math.min(this.battleState.pMax,this.battleState.pHp+heal);this.log('💚 恢復 '+heal+' HP','green');this.s.inv[pk].qty--;if(this.s.inv[pk].qty<=0)delete this.s.inv[pk];this.battleMonsterAttack();this.renderBattle();},
battleFlee(){if(Math.random()<0.4){this.log('🏃 逃脫！','green');this.endBattle();return;}this.log('❌ 逃脫失敗！','red');this.battleMonsterAttack();this.renderBattle();},
battleMonsterAttack(){const dmg=this.rand(5,15);this.battleState.pHp-=dmg;this.flash('charSprite');this.showDamage('charSprite',dmg,false);this.log('👹 怪物攻擊 -'+dmg,'red');if(this.battleState.pHp<=0){this.battleLose();return;}},
battleWin(){this.s.ach.kills++;this.s.daily.kills++;this.s.adena+=this.rand(100,300);this.s.exp=Math.min(this.need(),this.s.exp+this.rand(50,150));this.log('🎉 勝利！','green');setTimeout(()=>this.endBattle(),1500);},
battleLose(){this.log('💀 戰敗...','red');this.battleState.pHp=0;setTimeout(()=>this.endBattle(),1500);},
battleEnd(){this.endBattle();},
endBattle(){this.inBattle=false;this.$('battleScreen').style.display='none';this.level();this.render();},
maxHp(){const st=this.total();return Math.max(1,Math.floor(120+this.s.lv*22+(st.con||10)*12));},
maxMp(){const st=this.total();return Math.max(1,Math.floor(55+this.s.lv*9+(st.wis||10)*8));},
need(){return Math.floor(Math.pow(this.s.lv,1.5)*100);},
level(){while(this.s.exp>=this.need()){this.s.exp-=this.need();this.s.lv++;this.s.hp=this.maxHp();this.s.mp=this.maxMp();}},
hunt(){const m=this.map();if(!m)return;const mon={name:m.mons[this.rand(0,m.mons.length-1)],hp:this.rand(m.min*10,m.min*20)};this.startBattle(mon.name,mon.hp);},
render(){const st=this.total();this.$('className').textContent=this.cls().name;this.$('lv').textContent='Lv.'+this.s.lv;this.$('adena').textContent='💰 '+this.fmt(this.s.adena);this.$('diamond').textContent='💎 '+this.fmt(this.s.diamond);const tabs=['dash','hunt','bag'];const thtml=tabs.map(t=>'<button class="'+(this.tab===t?'on':'')+'">'+(['總覽','狩獵','背包'][tabs.indexOf(t)])+'</button>').join('');this.$('tabs').innerHTML=thtml;this.$('body').innerHTML=this.tab==='hunt'?this.viewHunt():this.tab==='bag'?this.viewBag():'<h3 class="title">總覽</h3><div class="card"><b>戰力</b> <span class="gold">'+Math.floor(st.dmg*12+this.s.lv*30)+'</span></div>';},
viewHunt(){const maps=DB.maps.map(m=>`<div class="card" style="cursor:pointer" onclick="G.s.map='${m.id}';G.hunt()"><b>${E(m.name)}</b><br/><span class="muted">Lv.${m.min}-${m.max}</span></div>`).join('');return `<h3 class="title">狩獵地圖</h3><p class="muted">點擊進入戰鬥</p><div class="grid">${maps}</div>`;},
viewBag(){const items=Object.keys(this.s.inv).map(k=>{const it=this.inv(k),d=this.def(it?.id);if(!d)return'';return `<div class="card"><b class="r-${d.rank}">${E(d.name)} ×${it.qty}</b></div>`;}).join('');return `<h3 class="title">背包</h3><div class="grid">${items}</div>`;},
classList(){const html=Object.values(DB.classes).map(c=>`<button class="card" onclick="G.s=G.base('${c.id}');G.render();window.G.$('classModal').classList.add('hide');window.G.$('app').classList.remove('hide');">${c.name}<br/><span class="muted">${c.desc}</span></button>`).join('');this.$('classList').innerHTML=html;},
bind(){this.$('newBtn').onclick=()=>{this.$('start').classList.add('hide');this.$('classModal').classList.remove('hide');};this.$('loadBtn').onclick=()=>{const save=Store.load();if(!save)return;this.s=save;this.render();this.$('start').classList.add('hide');this.$('app').classList.remove('hide');};this.$('tabs').addEventListener('click',e=>{if(e.target.tagName==='BUTTON'){const idx=Array.from(this.$('tabs').children).indexOf(e.target);this.tab=['dash','hunt','bag'][idx];this.render();}});}};
window.G=Game;Game.init();
</script>
</body>
</html>
